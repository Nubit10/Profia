[project]
name = "profe-ai-engine"
version = "0.1.0"
description = "AI Engine de Profe: retrieval curricular (SPEC-0005)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "fastembed>=0.8.1",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# El contrato JSON con la web usa camelCase (docs/ai/contracts).
"app/api/main.py" = ["N815"]

[tool.pytest.ini_options]
testpaths = ["tests"]
